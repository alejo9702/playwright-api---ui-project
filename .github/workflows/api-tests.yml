name: Api tests
on:
  push:
    branches: [ main, master ]

  pull_request:
    branches: [ main, master ]

  workflow_dispatch: { }

jobs:
  api-tests:
    runs-on: ubuntu-latest
    env:
      RAPID_API_KEY: ${{ secrets.RAPID_API_KEY }}
      FAKE_API_PLATZI_USER: ${{ secrets.FAKE_API_PLATZI_USER }}
      FAKE_API_PLATZI_PASSWORD: ${{ secrets.FAKE_API_PLATZI_PASSWORD }}
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Install playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Api tests
        run: np playwright test --grep "@api"
      - name: Upload Playwright report
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30


